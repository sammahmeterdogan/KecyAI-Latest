# -------------------------------------------------------------
# HARDWARE OVERLAY - Linux/WSL2 only
#
# This overlay enables real robot hardware access.
# Admin one-time setup (terminal required):
#
#   docker compose -f infra/compose/docker-compose.yml \
#                  -f infra/compose/docker-compose.hardware.yml up -d
#
# IMPORTANT:
#   - Only works on Linux or WSL2 (host must expose /dev/ttyUSB*)
#   - Requires robot plugged in before container start
#   - Windows Docker Desktop does not support device passthrough
# -------------------------------------------------------------

services:
  runtime:
    # Grant serial port access
    privileged: true
    group_add:
      - dialout

    devices:
      - "/dev/ttyUSB0:/dev/ttyUSB0"   # SO-101 Feetech serial bus
      # Uncomment additional devices as needed:
      # - "/dev/ttyACM0:/dev/ttyACM0"
      - "/dev/video0:/dev/video0"     # Camera 1
      - "/dev/video2:/dev/video2"     # Camera 2

    environment:
      - DRY_RUN=false
      - SERIAL_PORT=/dev/ttyUSB0
      - ROBOT_TYPE=so101_follower
      - DRIVER_TYPE=feetech

    volumes:
      # Persist calibration data across container restarts
      - kecyai-calibration:/home/kecyai/.kecyai/calibration

volumes:
  kecyai-calibration:
    driver: local
