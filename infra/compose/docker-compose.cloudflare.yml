services:
  frontend:
    environment:
      - VITE_API_BASE_URL=http://runtime:8040

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: kecyai-cloudflared
    command: tunnel --no-autoupdate --url http://frontend:3000
    depends_on:
      - frontend
    restart: unless-stopped
    networks:
      - kecy-network
