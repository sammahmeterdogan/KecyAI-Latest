server.port=8080
spring.application.name=kecy-backend

# Default Runtime URL (overridden by env var in compose)
lerobot.runtime.base-url=http://localhost:8100

# Runtime autostart (optional — requires docker.sock mount)
runtime.autostart.enabled=false
runtime.autostart.timeout-seconds=30
runtime.autostart.container-name=kecyai-runtime